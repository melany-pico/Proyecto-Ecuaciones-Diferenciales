name: dynadistill
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy=1.26
  - scipy=1.13
  - pandas=2.2
  - matplotlib=3.9
  - scikit-learn=1.5
  - sympy=1.13
  - pyyaml=6
  - requests
  - xarray
  - netcdf4
  - pytest
  - pip
  - pip:
      - torch>=2.3,<3
      - torchdiffeq>=0.2.4,<1
      - pysindy>=1.7.5,<3
      - cdsapi>=0.7,<1
